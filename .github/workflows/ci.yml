name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # Gate on rules that catch real defects: security (S), undefined names and
      # unused imports (F), syntax errors (E9). Style rules run in `make lint` as
      # advisory -- the ported research code predates this config and is kept
      # faithful to the thesis rather than rewritten to satisfy a linter.
      - name: Lint (security and correctness)
        run: uv run ruff check --select S,F82,E9 --exclude notebooks .

      - name: Format check
        run: uv run ruff format --check --exclude notebooks .

      - name: Build parser service
        run: docker build -t mermaid-parser-service services/mermaid_parser

      - name: Start parser service
        run: |
          docker run -d -p 9595:8000 --name mermaid-parser-instance mermaid-parser-service
          for i in $(seq 1 30); do
            curl -sf -X POST http://localhost:9595/diagram \
              -H 'Content-Type: application/json' \
              -d '{"code":"graph TD; A-->B;"}' >/dev/null && break
            sleep 2
          done

      - name: Test
        run: uv run pytest
