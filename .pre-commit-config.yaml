repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(data/|tests/fixtures/diagrams\.py|src/vlm_diagram_eval/llm/prompts\.py)
      - id: trailing-whitespace
        exclude: ^(data/|tests/fixtures/diagrams\.py|src/vlm_diagram_eval/llm/prompts\.py)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(data/|tests/fixtures/diagrams\.py|src/vlm_diagram_eval/llm/prompts\.py)
      - id: ruff-format
        exclude: ^(data/|tests/fixtures/diagrams\.py|src/vlm_diagram_eval/llm/prompts\.py)

  # Strips notebook output so diffs stay reviewable and the repo stays small.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
